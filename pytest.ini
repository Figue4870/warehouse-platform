[pytest]
# pytest tests/unit tests/central tests/iot (sin Docker) | pytest tests/integration (con Docker)
# FAILURE_TESTS=1 pytest tests/failure (apaga y prende componentes reales)
testpaths = tests/unit tests/central tests/iot tests/integration tests/failure
pythonpath = services/warehouse services/common services/central services/iot
addopts = -ra
markers =
    integration: pruebas contra la API real (PostgreSQL + Redis) levantada con Docker
    failure: pruebas de fallos que apagan componentes reales
filterwarnings =
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively
