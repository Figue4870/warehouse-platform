[pytest]
# pytest tests/unit (sin Docker) | pytest tests/integration (con la bodega levantada)
testpaths = tests/unit tests/integration
pythonpath = src/backend/app src/common
addopts = -ra
markers =
    integration: pruebas contra la API real (PostgreSQL + Redis) levantada con Docker
filterwarnings =
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively
