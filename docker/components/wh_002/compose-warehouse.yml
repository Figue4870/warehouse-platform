# Bodega WH-002: PostgreSQL, Redis, API y frontend. Variables en docker/components/wh_002/.env

# Formato ${VARIABLE:-valor}: si el .env no trae la variable, se usa el valor por defecto.

services:
  wh_002_postgres_db:
    image: postgres:15-alpine
    container_name: db_warehouse_${WH_ID}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-warehouse_db}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # schema.sql se ejecuta SOLO la primera vez (cuando el volumen está vacío)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # carpeta db/ visible dentro del contenedor para cargar seed.sql a mano
      - ./db:/db:ro
      # los datos sobreviven a "docker compose down" (se borran con "down -v")
      - wh_002_pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 => espera al servidor definitivo y no al temporal que corre schema.sql
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-warehouse_db} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  wh_002_redis:
    image: redis:7-alpine
    container_name: redis_warehouse_${WH_ID}
    # Caché pura: sin persistencia en disco, máximo 64 MB y, si se llena,
    # Redis expulsa las claves menos usadas (allkeys-lru).
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  wh_002_warehouse_api:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: warehouse_api_node_${WH_ID}
    ports:
      - "${BE_PORT}:8000"
    environment:
      WAREHOUSE_ID: ${WH_ID}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@wh_002_postgres_db:5432/${DB_NAME:-warehouse_db}
      AUTO_CREATE_TABLES: "false"          # las tablas las crea db/schema.sql
      REDIS_URL: redis://wh_002_redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    depends_on:
      wh_002_postgres_db:
        condition: service_healthy         # sin BD la bodega no puede operar
      wh_002_redis:
        condition: service_started         # Redis es opcional: la API funciona sin él
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  wh_002_warehouse_frontend:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: warehouse_frontend_node_${WH_ID}
    ports:
      - "${FE_PORT}:80"
    environment:
      # Nginx reenvía /api/* a la API, así el navegador no necesita conocer su puerto
      API_TARGET: wh_002_warehouse_api:8000
    depends_on:
      - wh_002_warehouse_api

volumes:
  wh_002_pgdata:
