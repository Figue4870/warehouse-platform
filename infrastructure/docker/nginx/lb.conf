# Balanceador de una bodega (Fase 5): round-robin entre api_1, api_2 y api_3.
# Si una instancia falla se reintenta en otra y se saca 10 s tras 2 fallos.


resolver 127.0.0.11 valid=10s ipv6=off;

upstream warehouse_api {
    zone warehouse_api 64k;    
    server warehouse_api_1_${WH_ID}:8000 resolve max_fails=2 fail_timeout=10s;
    server warehouse_api_2_${WH_ID}:8000 resolve max_fails=2 fail_timeout=10s;
    server warehouse_api_3_${WH_ID}:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;             
}

server {
    listen 80;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://warehouse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Reintenta en otra instancia solo si no se pudo conectar.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # Para ver en la respuesta qué instancia atendió.
        add_header X-Upstream $upstream_addr always;
    }
}
