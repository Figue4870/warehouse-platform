# Nodo adicional de API de una bodega: 3 copias de la API y su balanceador. Usa PostgreSQL y Redis
# del nodo principal (PRIMARY_HOST). Se levanta con ./manage_warehouse.sh start-api <bodega>.

x-api: &api
  build:
    context: ../../../services
    dockerfile: warehouse/Dockerfile
  environment: &api-env
    WAREHOUSE_ID: ${WH_ID}
    DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${PRIMARY_HOST:?PRIMARY_HOST requerido}:${DB_PORT}/${DB_NAME:-warehouse_db}
    AUTO_CREATE_TABLES: "false"
    REDIS_URL: redis://${PRIMARY_HOST}:${REDIS_PORT:-6380}/0
    CACHE_ENABLED: ${CACHE_ENABLED:-true}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    CACHE_INVALIDATION_MODE: ${CACHE_INVALIDATION_MODE:-both}
    HEARTBEAT_SECRET: ${HEARTBEAT_SECRET:-}
    AUTH_ENABLED: ${AUTH_ENABLED:-true}
    CENTRAL_API_URL: ${CENTRAL_API_URL:?CENTRAL_API_URL requerido}
    CATALOG_STRICT: ${CATALOG_STRICT:-true}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 3
  restart: unless-stopped

services:
  api_1:
    <<: *api
    container_name: warehouse_api_1_${WH_ID}
    environment:
      <<: *api-env
      INSTANCE_NAME: ${WH_ID}-${NODE_NAME:-nodo2}-api-1

  api_2:
    <<: *api
    container_name: warehouse_api_2_${WH_ID}
    environment:
      <<: *api-env
      INSTANCE_NAME: ${WH_ID}-${NODE_NAME:-nodo2}-api-2

  api_3:
    <<: *api
    container_name: warehouse_api_3_${WH_ID}
    environment:
      <<: *api-env
      INSTANCE_NAME: ${WH_ID}-${NODE_NAME:-nodo2}-api-3

  lb:
    image: nginx:1.27-alpine
    container_name: lb_warehouse_${WH_ID}
    ports:
      - "${BE_PORT}:80"
    volumes:
      - ../nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api_1
      - api_2
      - api_3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
